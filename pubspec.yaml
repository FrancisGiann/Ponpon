name: pocket_entry
description: Ponpon Budget & Expenses, a private offline ledger with explicit wallet entry.
publish_to: none
version: 0.2.8+10
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: false
  assets:
    - assets/branding/ponpon-icon.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
